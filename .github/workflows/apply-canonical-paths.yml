name: Apply canonical Stage 1 paths

on:
  push:
    branches:
      - refactor/canonical-paths

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-paths
          fetch-depth: 0

      - name: Rename the self-host generation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path("build.sh")
          text = build.read_text()
          for old, new in (
              ("SRC2_LL_DIR", "SELFHOST_SRC_LL_DIR"),
              ("LINK2_LL_DIR", "SELFHOST_LINK_LL_DIR"),
              ("OBJ2_DIR", "SELFHOST_OBJ_DIR"),
              ("TEST2_LL_DIR", "SELFHOST_TEST_LL_DIR"),
              ("TEST2_EXE_DIR", "SELFHOST_TEST_EXE_DIR"),
              ("build_weavec2", "build_weavec1_selfhost"),
              ("WEAVEC2", "WEAVEC1_SELFHOST"),
          ):
              text = text.replace(old, new)
          text = re.sub(r"\bweavec2\b", "weavec1-selfhost", text)
          build.write_text(text)

          for name in (
              "README.md",
              "CONTRIBUTING.md",
              "docs/STABLE_CORE.md",
              "docs/STABILIZATION.md",
              "docs/LLVM_FIXTURES.md",
          ):
              path = Path(name)
              text = path.read_text()
              text = text.replace("build/weavec2", "build/weavec1-selfhost")
              text = re.sub(r"\bweavec2\b", "weavec1-selfhost", text)
              path.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              "The second generation is conceptually **`weavec1-selfhost`**. The current build\n"
              "still writes the historical compatibility path `build/weavec1-selfhost`; that filename\n"
              "does not refer to the user-facing [`weavec`](https://github.com/ahojukka5/weavec)\n"
              "repository.\n",
              "The second generation is named **`weavec1-selfhost`** and is written to\n"
              "`build/weavec1-selfhost`. It is the same WIR compiler rebuilt by itself; it is\n"
              "not the user-facing [`weavec`](https://github.com/ahojukka5/weavec) compiler.\n",
          )
          text = text.replace(
              "- The second-generation output still uses the historical path `build/weavec1-selfhost`.\n",
              "",
          )
          readme.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## [Unreleased]\n"
          entry = (
              "\n### Changed\n\n"
              "- Renamed the second Stage 1 bootstrap generation from the ambiguous\n"
              "  `build/weavec2` path to `build/weavec1-selfhost`.\n"
              "- Renamed the corresponding build variables, directories, diagnostics, and\n"
              "  documentation to distinguish it from the user-facing `weavec` compiler.\n"
          )
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          changelog.write_text(text)

          Path(".github/workflows/apply-canonical-paths.yml").unlink()
          PY

      - name: Validate refactor
        shell: bash
        run: |
          bash -n build.sh
          git diff --check
          ! grep -R --exclude=CHANGELOG.md --exclude-dir=.git -n 'build/weavec2' .

      - name: Commit canonical paths
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: name the Stage 1 self-host compiler clearly"
          git push origin HEAD:refactor/canonical-paths
