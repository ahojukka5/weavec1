# SPDX-License-Identifier: Apache-2.0
name: apply WIR v2 migration

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/apply-wir-v2-migration.py
      - .github/workflows/apply-wir-v2-migration.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/wir-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 1 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wir-v2
          fetch-depth: 0

      - name: Checkout Stage 0 v2 branch
        uses: actions/checkout@v4
        with:
          repository: ahojukka5/weavec0
          ref: agent/wir-v2-finalize
          path: weavec0-source
          fetch-depth: 0

      - name: Install LLVM and libc toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang musl-tools

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply migration
        run: python3 scripts/apply-wir-v2-migration.py

      - name: Honor explicit Stage 0 source override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.sh')
          text = path.read_text()
          old = '''  if [[ -n "${WEAVEC0_SDK:-}" ]]; then
              log "using WEAVEC0_SDK: $WEAVEC0_SDK"
              validate_sdk "$WEAVEC0_SDK"
            elif host_has_published_sdk; then
              download_weavec0_sdk
            else
              log "no published SDK for $(uname -s)/$(uname -m); using source fallback"
              ensure_weavec0_source
            fi
          '''
          new = '''  if [[ -n "${WEAVEC0_SDK:-}" ]]; then
              log "using WEAVEC0_SDK: $WEAVEC0_SDK"
              validate_sdk "$WEAVEC0_SDK"
            elif [[ -n "${WEAVEC0:-}" ]]; then
              ensure_weavec0_source
            elif host_has_published_sdk; then
              download_weavec0_sdk
            else
              log "no published SDK for $(uname -s)/$(uname -m); using source fallback"
              ensure_weavec0_source
            fi
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected ensure_weavec0 layout')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate complete bootstrap chain
        id: validate
        shell: bash
        run: |
          set +e
          WEAVEC0="$GITHUB_WORKSPACE/weavec0-source" bash build.sh > /tmp/wir-v2-bootstrap.log 2>&1
          status=$?
          if [[ $status == 0 ]]; then
            git diff --check >> /tmp/wir-v2-bootstrap.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wir-v2-bootstrap-log
          path: /tmp/wir-v2-bootstrap.log

      - name: Stop on validation failure
        if: steps.validate.outputs.status != '0'
        run: exit 1

      - name: Remove temporary machinery
        run: |
          git rm scripts/apply-wir-v2-migration.py
          git rm .github/workflows/apply-wir-v2-migration.yml

      - name: Commit and push
        run: |
          git add -A
          git commit -m 'release: migrate Stage 1 to WIR v2'
          git push origin HEAD:agent/wir-v2
