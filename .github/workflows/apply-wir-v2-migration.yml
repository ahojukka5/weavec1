# SPDX-License-Identifier: Apache-2.0
name: apply WIR v2 migration

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/apply-wir-v2-migration.py
      - .github/workflows/apply-wir-v2-migration.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/wir-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 1 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wir-v2
          fetch-depth: 0

      - name: Checkout Stage 0 v2 branch
        uses: actions/checkout@v4
        with:
          repository: ahojukka5/weavec0
          ref: agent/wir-v2-finalize
          path: weavec0-source
          fetch-depth: 0

      - name: Install LLVM and libc toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang musl-tools

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply migration
        run: python3 scripts/apply-wir-v2-migration.py

      - name: Validate complete bootstrap chain
        run: |
          WEAVEC0="$GITHUB_WORKSPACE/weavec0-source" bash build.sh
          git diff --check

      - name: Remove temporary machinery
        run: |
          git rm scripts/apply-wir-v2-migration.py
          git rm .github/workflows/apply-wir-v2-migration.yml

      - name: Commit and push
        run: |
          git add -A
          git commit -m 'release: migrate Stage 1 to WIR v2'
          git push origin HEAD:agent/wir-v2
