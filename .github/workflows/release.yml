# SPDX-License-Identifier: Apache-2.0
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ordinary compiler correctness is covered by ci.yml on every pull request
  # and master push. Packaging here repeats the same Linux glibc/musl ladder
  # and throws the archives away unless this run actually publishes. Skip that
  # work when the VERSION release already exists.
  decide:
    name: Decide whether to package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.decide.outputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether this run publishes an SDK
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] || \
             [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf 'package=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'package=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'package=true\n' >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Linux x86-64 (${{ matrix.libc }})
    needs: decide
    if: needs.decide.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]

    env:
      WEAVEC0_VERSION: v0.4.0
      WEAVEC0_LIBC: ${{ matrix.libc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit frozen WIR source boundary
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/check_wir_source_style.py
            python3 scripts/audit_wir_reachability.py
          } 2>&1 | tee audit.log

      - name: Install LLVM and libc toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            clang \
            curl \
            file \
            llvm \
            musl-tools

      - name: Show toolchain versions
        run: |
          clang --version
          llvm-as --version
          llvm-link --version
          musl-gcc --version

      - name: Build compiler chain and run the full ladder
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Select archive version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            version="v$(tr -d '[:space:]' < VERSION)"
          else
            version="git-${GITHUB_SHA::12}"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build static ${{ matrix.libc }} SDK archive
        run: |
          bash scripts/package-linux-sdk.sh \
            "${{ matrix.libc }}" \
            "${{ steps.version.outputs.value }}" \
            dist

      - name: Upload SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: weavec1-linux-x86_64-${{ matrix.libc }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ matrix.libc }}
          path: |
            audit.log
            build.log
            build/audit/*.json
          if-no-files-found: warn
          retention-days: 7

  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: decide
    if: needs.decide.outputs.package == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    env:
      WEAVEC0_VERSION: v0.4.0
      WEAVEC0_TAG: v0.4.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          brew install llvm git
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Run the deterministic packaging regression
        run: bash test/package-macos-sdk/test.sh

      - name: Build compiler chain and run the full ladder
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Select archive version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            version="v$(tr -d '[:space:]' < VERSION)"
          else
            version="git-${GITHUB_SHA::12}"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build native macOS SDK archive
        run: |
          scripts/package-macos-sdk.sh \
            "${{ steps.version.outputs.value }}" \
            dist

      - name: Upload SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: weavec1-macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-macos-${{ matrix.arch }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            replace=true
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
            replace=false
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'replace=%s\n' "$replace" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Download SDK archives
        if: >-
          steps.existing.outputs.exists != 'true' ||
          steps.release.outputs.replace == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: weavec1-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        if: >-
          steps.existing.outputs.exists != 'true' ||
          steps.release.outputs.replace == 'true'
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish new release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "weavec1 $RELEASE_TAG"

      - name: Replace assets for explicit tag build
        if: >-
          steps.existing.outputs.exists == 'true' &&
          steps.release.outputs.replace == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.tar.gz dist/SHA256SUMS \
            --clobber

      - name: Keep an existing VERSION release immutable
        if: >-
          steps.existing.outputs.exists == 'true' &&
          steps.release.outputs.replace != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: echo "$RELEASE_TAG already exists; leaving its assets unchanged"
