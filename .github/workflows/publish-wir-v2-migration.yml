# SPDX-License-Identifier: Apache-2.0
name: publish validated WIR v2 migration

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/publish-wir-v2-migration.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/wir-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 1 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wir-v2
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply validated migration
        run: |
          python3 scripts/apply-wir-v2-migration.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.sh')
          text = path.read_text()
          old = '''  if [[ -n "${WEAVEC0_SDK:-}" ]]; then
              log "using WEAVEC0_SDK: $WEAVEC0_SDK"
              validate_sdk "$WEAVEC0_SDK"
            elif host_has_published_sdk; then
              download_weavec0_sdk
            else
              log "no published SDK for $(uname -s)/$(uname -m); using source fallback"
              ensure_weavec0_source
            fi
          '''
          new = '''  if [[ -n "${WEAVEC0_SDK:-}" ]]; then
              log "using WEAVEC0_SDK: $WEAVEC0_SDK"
              validate_sdk "$WEAVEC0_SDK"
            elif [[ -n "${WEAVEC0:-}" ]]; then
              ensure_weavec0_source
            elif host_has_published_sdk; then
              download_weavec0_sdk
            else
              log "no published SDK for $(uname -s)/$(uname -m); using source fallback"
              ensure_weavec0_source
            fi
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected ensure_weavec0 layout')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Remove temporary machinery
        run: |
          git rm scripts/apply-wir-v2-migration.py
          git rm .github/workflows/apply-wir-v2-migration.yml
          git rm .github/workflows/publish-wir-v2-migration.yml

      - name: Commit and push
        run: |
          git add -A
          git commit -m 'release: migrate Stage 1 to WIR v2'
          git push origin HEAD:agent/wir-v2
