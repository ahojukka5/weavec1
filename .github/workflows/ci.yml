# SPDX-License-Identifier: Apache-2.0
#
# Continuous integration for weavec1 on the portfolio's self-hosted Linux
# runner fleet. The historical GitHub-hosted macOS source-fallback leg is not
# emulated on Linux.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc-sdk
            libc: glibc
          - name: linux-musl-sdk
            libc: musl

    env:
      WEAVEC0_VERSION: v0.4.0
      WEAVEC0_TAG: v0.4.0
      WEAVEC0_LIBC: ${{ matrix.libc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation
        run: python3 scripts/check_docs.py

      - name: Install LLVM and SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            curl \
            llvm \
            musl-tools
          clang --version
          llvm-as --version
          musl-gcc --version

      - name: Audit frozen WIR implementation
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/check_wir_source_style.py
            python3 scripts/audit_wir_reachability.py
          } 2>&1 | tee audit.log

      - name: Build compiler chain and run full ladder
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Upload failed diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.name }}-${{ github.run_id }}
          path: |
            audit.log
            build.log
            build/audit/*.json
          if-no-files-found: warn
          retention-days: 7
