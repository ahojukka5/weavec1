# SPDX-License-Identifier: Apache-2.0
#
# Continuous integration for weavec1.
#
# Linux consumes the published weavec0 bootstrap SDK. macOS retains the source
# fallback until a native SDK is published for that platform.

name: ci

on:
  push:
    branches: [master, agent/audit-source-inventory]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc-sdk
            os: ubuntu-latest
            libc: glibc
          - name: linux-musl-sdk
            os: ubuntu-latest
            libc: musl
          - name: macos-source-fallback
            os: macos-latest
            libc: glibc

    env:
      WEAVEC0_VERSION: v0.4.0
      WEAVEC0_TAG: v0.4.0
      WEAVEC0_LIBC: ${{ matrix.libc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reviewed WIR pruning
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/agent/audit-source-inventory' &&
          matrix.name == 'linux-glibc-sdk'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prune_audited_unreachable_wir.py
          if ! git diff --quiet -- src/emit_context.wir src/tokens.wir; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/emit_context.wir src/tokens.wir
            git commit -m "audit: remove unreachable Stage 1 helpers"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Install LLVM and SDK tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            curl \
            llvm \
            musl-tools
          clang --version
          llvm-as --version
          musl-gcc --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm git
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          git --version

      - name: Audit frozen WIR source boundary
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/check_wir_source_style.py
            python3 scripts/audit_wir_reachability.py
          } 2>&1 | tee audit.log

      - name: Build compiler chain and run full ladder
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Upload failed diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.name }}-${{ github.run_id }}
          path: |
            audit.log
            build.log
            build/audit/*.json
            src/*.wir
          if-no-files-found: warn
          retention-days: 7
