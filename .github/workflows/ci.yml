# SPDX-License-Identifier: Apache-2.0
#
# Continuous integration for weavec1.
#
# Builds weavec1 from source and runs the full test ladder on Linux and
# macOS using the platform's stable LLVM toolchain. The build.sh script
# auto-fetches the pinned weavec0 tag (default v0.2.0) from
# github.com/ahojukka5/weavec0 into build/vendor/weavec0; CI uses that
# default unless WEAVEC0_TAG is explicitly overridden below.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      # Pin the weavec0 tag CI builds against. Bump this when weavec0
      # cuts a new release that weavec1 has actually been validated against.
      WEAVEC0_TAG: v0.2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          echo "Tool versions:"
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build weavec0 dependency, build weavec1, run ladder
        run: ./build.sh
