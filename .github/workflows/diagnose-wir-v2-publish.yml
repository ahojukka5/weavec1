# SPDX-License-Identifier: Apache-2.0
name: diagnose WIR v2 publication

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/diagnose-wir-v2-publish.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/wir-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wir-v2
          fetch-depth: 0

      - name: Configure and apply
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/apply-wir-v2-migration.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.sh')
          text = path.read_text()
          old = '''  if [[ -n "${WEAVEC0_SDK:-}" ]]; then
              log "using WEAVEC0_SDK: $WEAVEC0_SDK"
              validate_sdk "$WEAVEC0_SDK"
            elif host_has_published_sdk; then
              download_weavec0_sdk
            else
              log "no published SDK for $(uname -s)/$(uname -m); using source fallback"
              ensure_weavec0_source
            fi
          '''
          new = '''  if [[ -n "${WEAVEC0_SDK:-}" ]]; then
              log "using WEAVEC0_SDK: $WEAVEC0_SDK"
              validate_sdk "$WEAVEC0_SDK"
            elif [[ -n "${WEAVEC0:-}" ]]; then
              ensure_weavec0_source
            elif host_has_published_sdk; then
              download_weavec0_sdk
            else
              log "no published SDK for $(uname -s)/$(uname -m); using source fallback"
              ensure_weavec0_source
            fi
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected ensure_weavec0 layout')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Capture publication transcript
        shell: bash
        run: |
          set +e
          {
            echo '=== status before add ==='
            git status --short
            echo '=== add ==='
            git add -A
            echo "add status=$?"
            echo '=== status after add ==='
            git status --short
            echo '=== commit ==='
            git commit -m 'release: migrate Stage 1 to WIR v2'
            echo "commit status=$?"
            echo '=== push ==='
            git push origin HEAD:agent/wir-v2
            echo "push status=$?"
          } > /tmp/wir-v2-publish.log 2>&1
          exit 0

      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: wir-v2-publish-log
          path: /tmp/wir-v2-publish.log
